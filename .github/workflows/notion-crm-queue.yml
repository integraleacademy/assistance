name: Notion CRM - file d'attente

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Notion CRM - préparer la PR avec Codex"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: notion-crm-queue
  cancel-in-progress: false

jobs:
  queue:
    name: Remplir les créneaux de développement CRM
    if: github.repository == 'integraleacademy/assistance'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Préparer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le client HTTP
        run: python -m pip install --disable-pip-version-check requests

      - name: Vérifier la configuration minimale
        id: configuration
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$NOTION_API_TOKEN" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Automatisation Notion CRM inactive : ajoutez NOTION_API_TOKEN et OPENAI_API_KEY dans les secrets GitHub."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculer les créneaux Codex disponibles
        id: capacity
        if: steps.configuration.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.CRM_AUTOMATION_GITHUB_TOKEN || github.token }}
          MAX_CONCURRENT: "3"
        run: |
          ACTIVE_COUNT="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/notion-crm-implement.yml/runs?per_page=50" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length'
          )"

          case "$ACTIVE_COUNT" in
            ''|*[!0-9]*) ACTIVE_COUNT=0 ;;
          esac

          AVAILABLE=$((MAX_CONCURRENT - ACTIVE_COUNT))
          if [ "$AVAILABLE" -lt 0 ]; then
            AVAILABLE=0
          fi

          echo "active_count=$ACTIVE_COUNT" >> "$GITHUB_OUTPUT"
          echo "available_slots=$AVAILABLE" >> "$GITHUB_OUTPUT"

          {
            echo "### Capacité de la file CRM"
            echo
            echo "- Codex actifs ou en attente de runner : **$ACTIVE_COUNT / $MAX_CONCURRENT**"
            echo "- Créneaux disponibles : **$AVAILABLE**"
            echo
            if [ "$AVAILABLE" -gt 0 ]; then
              echo "La file peut prendre jusqu'à **$AVAILABLE** demande(s) \`Prêt à coder\` pendant ce passage."
            else
              echo "Les trois créneaux sont occupés. Les demandes restantes restent sur **Prêt à coder** jusqu'à la libération d'un créneau."
            fi
            echo
            echo "Les PR déjà ouvertes ne consomment aucun créneau et ne bloquent jamais la file."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remplir les créneaux libres avec les prochaines demandes
        if: steps.configuration.outputs.configured == 'true' && fromJSON(steps.capacity.outputs.available_slots || '0') > 0
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MEDIA_MODEL: gpt-5.6-luna
          NOTION_DATA_SOURCE_ID: 7f12fe92-dbc4-40c8-af4e-77578b5dbfc0
          GITHUB_TOKEN: ${{ secrets.CRM_AUTOMATION_GITHUB_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_TASKS: ${{ steps.capacity.outputs.available_slots }}
          CHATGPT_WORKSPACE_AGENT_TOKEN: ${{ secrets.CHATGPT_WORKSPACE_AGENT_TOKEN }}
          CHATGPT_WORKSPACE_AGENT_TRIGGER_ID: ${{ secrets.CHATGPT_WORKSPACE_AGENT_TRIGGER_ID }}
        run: python notion_crm_automation.py queue
