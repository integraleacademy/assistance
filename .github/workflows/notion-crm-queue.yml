name: Notion CRM - file d'attente

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: notion-crm-queue
  cancel-in-progress: false

jobs:
  queue:
    name: Détecter la prochaine demande CRM prête
    if: github.repository == 'integraleacademy/assistance'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Préparer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le client HTTP
        run: python -m pip install --disable-pip-version-check requests

      - name: Vérifier la configuration minimale
        id: configuration
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$NOTION_API_TOKEN" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Automatisation Notion CRM inactive : ajoutez NOTION_API_TOKEN et OPENAI_API_KEY dans les secrets GitHub."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Vérifier qu'aucun traitement CRM n'est déjà actif
        id: active_work
        if: steps.configuration.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.CRM_AUTOMATION_GITHUB_TOKEN || github.token }}
        run: |
          ACTIVE_RUN_URL="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/notion-crm-implement.yml/runs?per_page=50" \
              --jq '.workflow_runs | map(select(.status != "completed")) | .[0].html_url // ""'
          )"

          if [ -n "$ACTIVE_RUN_URL" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "url=$ACTIVE_RUN_URL" >> "$GITHUB_OUTPUT"
            echo "::notice::Une demande CRM est déjà en cours de préparation : $ACTIVE_RUN_URL"
            {
              echo "### File Notion CRM en attente"
              echo
              echo "Un traitement Codex est déjà en cours : $ACTIVE_RUN_URL"
              echo
              echo "Les autres demandes restent sur **Prêt à coder**. Dès que ce traitement atteint **PR disponible** ou se termine en erreur, la demande suivante pourra démarrer, même si des PR précédentes restent ouvertes."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
            {
              echo "### Mode lot nocturne actif"
              echo
              echo "Aucun traitement Codex n'est en cours. Les pull requests déjà ouvertes ne bloquent plus la file : la prochaine demande **Prêt à coder** peut démarrer."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prendre en charge la prochaine page Notion prête
        if: steps.configuration.outputs.configured == 'true' && steps.active_work.outputs.active != 'true'
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_DATA_SOURCE_ID: 7f12fe92-dbc4-40c8-af4e-77578b5dbfc0
          GITHUB_TOKEN: ${{ secrets.CRM_AUTOMATION_GITHUB_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAX_TASKS: "1"
          CHATGPT_WORKSPACE_AGENT_TOKEN: ${{ secrets.CHATGPT_WORKSPACE_AGENT_TOKEN }}
          CHATGPT_WORKSPACE_AGENT_TRIGGER_ID: ${{ secrets.CHATGPT_WORKSPACE_AGENT_TRIGGER_ID }}
        run: python notion_crm_automation.py queue
