name: Notion CRM - vérifier l'automatisation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/notion-crm-*.yml"
      - "notion_crm_automation.py"
      - "notion_crm_lib/**"

permissions:
  contents: read

concurrency:
  group: notion-crm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifier le mode Work direct
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Préparer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer YAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Vérifier la compilation Python encore utilisée par la synchro Notion
        run: python -m py_compile notion_crm_automation.py notion_crm_lib/*.py

      - name: Vérifier les workflows conservés
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          expected_jobs = {
              ".github/workflows/notion-crm-ci.yml": {"verify"},
              ".github/workflows/notion-crm-pr-sync.yml": {"sync"},
              ".github/workflows/notion-crm-work-pr-ci.yml": {"validate"},
              ".github/workflows/notion-crm-refresh-open-prs.yml": {"refresh"},
              ".github/workflows/notion-crm-auto-merge.yml": {"merge"},
              ".github/workflows/notion-crm-legacy-pr-publish.yml": {"inspect", "test", "publish"},
          }
          obsolete = [
              ".github/workflows/notion-crm-queue.yml",
              ".github/workflows/notion-crm-implement.yml",
              ".github/workflows/notion-crm-technical-recovery.yml",
              ".github/workflows/notion-crm-timeout-coordinator.yml",
          ]

          for filename, jobs in expected_jobs.items():
              payload = yaml.load(Path(filename).read_text(encoding="utf-8"), Loader=yaml.BaseLoader)
              assert isinstance(payload, dict), filename
              assert "on" in payload, f"Déclencheur absent : {filename}"
              actual_jobs = set((payload.get("jobs") or {}).keys())
              assert actual_jobs == jobs, (filename, actual_jobs, jobs)
              print(f"{filename}: OK")

          for filename in obsolete:
              assert not Path(filename).exists(), f"Ancien workflow Codex encore présent : {filename}"
              print(f"{filename}: supprimé")
          PY

      - name: Vérifier le diff Git
        run: |
          git fetch --no-tags origin main
          git diff --check origin/main...HEAD
