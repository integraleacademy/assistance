name: Notion CRM - coordonner les retries de timeout

on:
  workflow_run:
    workflows: ["Notion CRM - préparer la PR avec Codex"]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: notion-crm-timeout-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    name: Reprogrammer les timeouts sans bloquer la file
    if: github.repository == 'integraleacademy/assistance'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Préparer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer le client HTTP
        run: python -m pip install --disable-pip-version-check requests

      - name: Coordonner les retries
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          GH_TOKEN: ${{ secrets.CRM_AUTOMATION_GITHUB_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
          COMPLETED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMPLETED_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          NOTION_DATA_SOURCE_ID: 7f12fe92-dbc4-40c8-af4e-77578b5dbfc0
        run: |
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import os
          import re
          import sys
          from typing import Any

          import requests

          NOTION_TOKEN = os.environ.get("NOTION_API_TOKEN", "").strip()
          GH_TOKEN = os.environ.get("GH_TOKEN", "").strip()
          REPO = os.environ.get("GITHUB_REPOSITORY", "").strip()
          DATA_SOURCE_ID = os.environ.get("NOTION_DATA_SOURCE_ID", "").replace("-", "")
          EVENT_NAME = os.environ.get("EVENT_NAME", "")
          RUN_ID = os.environ.get("COMPLETED_RUN_ID", "").strip()
          RUN_URL = os.environ.get("COMPLETED_RUN_URL", "").strip()
          RUN_CONCLUSION = os.environ.get("COMPLETED_RUN_CONCLUSION", "").strip()

          if not NOTION_TOKEN or not GH_TOKEN or not REPO or len(DATA_SOURCE_ID) != 32:
              raise SystemExit("Configuration du coordinateur de retry incomplète.")

          notion_headers = {
              "Authorization": f"Bearer {NOTION_TOKEN}",
              "Notion-Version": "2026-03-11",
              "Content-Type": "application/json",
              "User-Agent": "IntegraleAcademy-NotionCRM-Retry/1.0",
          }
          github_headers = {
              "Authorization": f"Bearer {GH_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "IntegraleAcademy-NotionCRM-Retry/1.0",
          }

          def request(method: str, url: str, *, headers: dict[str, str], expected=(200,), **kwargs: Any) -> requests.Response:
              response = requests.request(method, url, headers=headers, timeout=(10, 45), **kwargs)
              if response.status_code not in set(expected):
                  raise RuntimeError(f"{method} {url}: HTTP {response.status_code} — {response.text[:1000]}")
              return response

          def gh_get(path: str) -> dict[str, Any]:
              return request("GET", f"https://api.github.com/repos/{REPO}/{path}", headers=github_headers).json()

          def gh_post(path: str, payload: dict[str, Any], expected=(200, 201, 204)) -> None:
              request(
                  "POST",
                  f"https://api.github.com/repos/{REPO}/{path}",
                  headers=github_headers,
                  expected=expected,
                  json=payload,
              )

          def notion_query(filter_payload: dict[str, Any], *, sorts: list[dict[str, Any]] | None = None, page_size: int = 10) -> list[dict[str, Any]]:
              payload: dict[str, Any] = {"filter": filter_payload, "page_size": page_size}
              if sorts:
                  payload["sorts"] = sorts
              data = request(
                  "POST",
                  f"https://api.notion.com/v1/data_sources/{DATA_SOURCE_ID}/query",
                  headers=notion_headers,
                  json=payload,
              ).json()
              return [item for item in data.get("results", []) if isinstance(item, dict)]

          def notion_update(page_id: str, properties: dict[str, Any]) -> None:
              request(
                  "PATCH",
                  f"https://api.notion.com/v1/pages/{page_id.replace('-', '')}",
                  headers=notion_headers,
                  json={"properties": properties},
              )

          def notion_comment(page_id: str, text: str) -> None:
              try:
                  request(
                      "POST",
                      "https://api.notion.com/v1/comments",
                      headers=notion_headers,
                      json={
                          "parent": {"page_id": page_id.replace("-", "")},
                          "rich_text": [{"type": "text", "text": {"content": text[:1900]}}],
                      },
                  )
              except Exception as exc:  # commentaire non bloquant
                  print(f"Avertissement commentaire Notion: {exc}", file=sys.stderr)

          def prop(page: dict[str, Any], name: str) -> dict[str, Any]:
              value = page.get("properties", {}).get(name, {})
              return value if isinstance(value, dict) else {}

          def select_value(page: dict[str, Any], name: str) -> str:
              value = prop(page, name).get("select")
              return str(value.get("name") or "") if isinstance(value, dict) else ""

          def rich_text_value(page: dict[str, Any], name: str) -> str:
              items = prop(page, name).get("rich_text")
              if not isinstance(items, list):
                  return ""
              return "".join(str(item.get("plain_text") or "") for item in items if isinstance(item, dict)).strip()

          def checkbox_value(page: dict[str, Any], name: str) -> bool:
              return bool(prop(page, name).get("checkbox"))

          def duration_seconds(started: str | None, completed: str | None) -> float:
              if not started or not completed:
                  return 0.0
              try:
                  start = dt.datetime.fromisoformat(started.replace("Z", "+00:00"))
                  end = dt.datetime.fromisoformat(completed.replace("Z", "+00:00"))
              except ValueError:
                  return 0.0
              return max(0.0, (end - start).total_seconds())

          # 1) Un premier timeout n'est plus un blocage rouge définitif.
          if EVENT_NAME == "workflow_run" and RUN_CONCLUSION == "cancelled" and RUN_ID and RUN_URL:
              jobs = gh_get(f"actions/runs/{RUN_ID}/jobs?per_page=100").get("jobs", [])
              codex_job = next(
                  (
                      job
                      for job in jobs
                      if isinstance(job, dict) and job.get("name") == "Produire la modification avec Codex"
                  ),
                  None,
              )
              is_timeout = bool(
                  isinstance(codex_job, dict)
                  and codex_job.get("conclusion") == "cancelled"
                  and duration_seconds(codex_job.get("started_at"), codex_job.get("completed_at")) >= 25 * 60
              )
              if is_timeout:
                  pages = notion_query(
                      {
                          "and": [
                              {"property": "Plateforme", "select": {"equals": "CRM"}},
                              {"property": "Run GitHub", "url": {"equals": RUN_URL}},
                          ]
                      },
                      page_size=1,
                  )
                  if pages:
                      page = pages[0]
                      page_id = str(page.get("id") or "")
                      status = select_value(page, "Statut")
                      already_retried = checkbox_value(page, "Retry timeout effectué")
                      if page_id and status == "En attente" and not already_retried:
                          notion_update(
                              page_id,
                              {
                                  "Statut": {"select": {"name": "Prêt à coder"}},
                                  "Retry timeout effectué": {"checkbox": True},
                                  "Erreur automatisation": {"rich_text": []},
                              },
                          )
                          notion_comment(
                              page_id,
                              "⏱️ La première tentative Codex a atteint le délai maximal. La demande n'est pas bloquée : elle sera retentée automatiquement une fois, après les autres demandes prêtes à coder.",
                          )
                          print(f"Timeout reclassé en retry différé pour {page_id}.")
                      elif already_retried:
                          print(f"Deuxième timeout pour {page_id} : maintien en En attente.")

          # 2) Ne relancer un retry qu'après avoir vidé la file normale.
          active_runs = gh_get("actions/workflows/notion-crm-implement.yml/runs?per_page=50").get("workflow_runs", [])
          if any(isinstance(run, dict) and run.get("status") != "completed" for run in active_runs):
              print("Un traitement CRM est actif : retry différé conservé.")
              raise SystemExit(0)

          in_progress = notion_query(
              {
                  "and": [
                      {"property": "Plateforme", "select": {"equals": "CRM"}},
                      {"property": "Statut", "select": {"equals": "En cours"}},
                  ]
              },
              page_size=1,
          )
          if in_progress:
              print("Une page Notion CRM est déjà En cours : retry différé conservé.")
              raise SystemExit(0)

          regular_ready = notion_query(
              {
                  "and": [
                      {"property": "Domaine", "select": {"equals": "Développement web"}},
                      {"property": "Plateforme", "select": {"equals": "CRM"}},
                      {"property": "Statut", "select": {"equals": "Prêt à coder"}},
                      {"property": "Préparation Work terminée", "checkbox": {"equals": True}},
                      {"property": "Préparé par Work le", "date": {"is_not_empty": True}},
                      {"property": "ID automatisation", "rich_text": {"is_empty": True}},
                  ]
              },
              page_size=1,
          )
          if regular_ready:
              print("La file normale contient encore des demandes : priorité à celles-ci.")
              raise SystemExit(0)

          deferred = notion_query(
              {
                  "and": [
                      {"property": "Domaine", "select": {"equals": "Développement web"}},
                      {"property": "Plateforme", "select": {"equals": "CRM"}},
                      {"property": "Statut", "select": {"equals": "Prêt à coder"}},
                      {"property": "Retry timeout effectué", "checkbox": {"equals": True}},
                      {"property": "ID automatisation", "rich_text": {"is_not_empty": True}},
                  ]
              },
              sorts=[{"timestamp": "last_edited_time", "direction": "ascending"}],
              page_size=10,
          )

          retry_page = None
          issue_number = 0
          for page in deferred:
              automation_id = rich_text_value(page, "ID automatisation")
              match = re.fullmatch(r"issue:(\d+)", automation_id)
              if not match:
                  continue
              candidate_issue = int(match.group(1))
              issue = gh_get(f"issues/{candidate_issue}")
              if issue.get("pull_request"):
                  continue
              if issue.get("state") != "open":
                  continue
              retry_page = page
              issue_number = candidate_issue
              break

          if not retry_page:
              print("Aucun retry différé à lancer.")
              raise SystemExit(0)

          page_id = str(retry_page.get("id") or "")
          if not page_id:
              raise SystemExit("Retry différé sans identifiant Notion.")

          notion_update(
              page_id,
              {
                  "Statut": {"select": {"name": "En cours"}},
                  "Erreur automatisation": {"rich_text": []},
              },
          )
          notion_comment(
              page_id,
              "🔁 La file normale est vide. L'unique nouvelle tentative après timeout démarre maintenant sur un runner neuf.",
          )
          gh_post(
              "dispatches",
              {
                  "event_type": "notion_crm_task",
                  "client_payload": {
                      "notion_page_id": page_id,
                      "issue_number": issue_number,
                      "title": "retry timeout",
                  },
              },
              expected=(204,),
          )
          print(f"Retry lancé pour {page_id} avec l'issue #{issue_number}.")
          PY
