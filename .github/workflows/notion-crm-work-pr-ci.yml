name: Notion CRM - vérifier les PR Work

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: notion-crm-work-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Contrôler la modification CRM préparée par Work
    if: startsWith(github.head_ref, 'work/notion-crm-')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer la PR
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Préparer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances de l'application
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Récupérer main
        run: git fetch --no-tags origin main

      - name: Exécuter les contrôles et tests ciblés
        run: python scripts/validate_notion_change.py --base origin/main

      - name: Vérifier le diff Git
        run: git diff --check origin/main...HEAD
