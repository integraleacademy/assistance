name: Notion CRM - publier les anciennes PR

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Numéro de la PR CRM historique à valider puis publier
        required: true
        type: string
      expected_head:
        description: SHA exact revu pour une correction mémoire manuelle
        required: false
        type: string
      review_id:
        description: Revue indépendante du SHA exact (correction mémoire manuelle)
        required: false
        type: string

permissions: {}

concurrency:
  group: notion-crm-legacy-pr-publish
  cancel-in-progress: false

jobs:
  inspect:
    name: Vérifier la PR historique
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.pull_request.head.ref, 'fix/crm-memory-') &&
       github.event.review.user.login == 'integraleacademy')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.meta.outputs.pr_number }}
      head_ref: ${{ steps.meta.outputs.head_ref }}
      head_sha: ${{ steps.meta.outputs.head_sha }}
      manual_memory: ${{ steps.meta.outputs.manual_memory }}
    steps:
      - name: Vérifier le périmètre et l'ordre
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.pr_number || github.event.pull_request.number }}
          EXPECTED_INPUT: ${{ inputs.expected_head || github.event.review.commit_id }}
          REVIEW_ID: ${{ inputs.review_id || github.event.review.id }}
        run: |
          set -euo pipefail

          case "$REQUESTED_PR" in
            ''|*[!0-9]*)
              echo "::error::Numéro de PR invalide : $REQUESTED_PR"
              exit 1
              ;;
          esac

          pr_json="$(gh pr view "$REQUESTED_PR" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,state,baseRefName,headRefName,headRefOid,body,isDraft)"

          state="$(printf '%s' "$pr_json" | jq -r '.state')"
          base="$(printf '%s' "$pr_json" | jq -r '.baseRefName')"
          head_ref="$(printf '%s' "$pr_json" | jq -r '.headRefName')"
          head_sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid')"
          body="$(printf '%s' "$pr_json" | jq -r '.body // ""')"

          if [ "$state" != "OPEN" ] || [ "$base" != "main" ]; then
            echo "PR #$REQUESTED_PR hors périmètre."
            exit 0
          fi
          # The manual memory incident follows the same test/publish path,
          # with an explicit SHA and independently reviewed report instead of
          # a fabricated Notion page. No other manual branches are accepted.
          if [[ "$head_ref" == fix/crm-memory-* ]]; then
            [[ "$GITHUB_REPOSITORY" == integraleacademy/assistance ]]
            [[ "$EXPECTED_INPUT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$REVIEW_ID" =~ ^[0-9]+$ ]]
            [[ "$head_sha" == "$EXPECTED_INPUT" ]]
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              [[ "$GITHUB_SHA" == "$EXPECTED_INPUT" ]]
            else
              # A review runs the PR merge revision. Its workflow definition
              # must be byte-for-byte the definition in the reviewed commit.
              workflow_path='.github/workflows/notion-crm-legacy-pr-publish.yml'
              reviewed="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=${EXPECTED_INPUT}" --jq '.sha')"
              executed="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=${GITHUB_SHA}" --jq '.sha')"
              [[ "$reviewed" == "$executed" ]]
            fi
            [[ "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${REQUESTED_PR}" --jq '.head.repo.full_name')" == "$GITHUB_REPOSITORY" ]]
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${REQUESTED_PR}/reviews/${REVIEW_ID}" > /tmp/memory-review.json
            jq -e --arg sha "$head_sha" '
              .user.login == "integraleacademy" and .commit_id == $sha and
              (.state == "COMMENTED" or .state == "APPROVED") and
              (.body | contains("Independent-Review: APPROVED " + $sha))
            ' /tmp/memory-review.json > /dev/null
            echo "pr_number=$REQUESTED_PR" >> "$GITHUB_OUTPUT"
            echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "manual_memory=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$head_ref" != agent/notion-crm-* ]]; then
            echo "PR #$REQUESTED_PR non historique : $head_ref"
            exit 0
          fi
          if [[ "$body" != *"<!-- notion-page-id:"* ]]; then
            echo "::error::PR #$REQUESTED_PR sans marqueur Notion."
            exit 1
          fi

          first_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --limit 100 \
            --json number,headRefName,body \
            --jq '[.[] | select((.headRefName | startswith("work/notion-crm-")) or (.headRefName | startswith("agent/notion-crm-"))) | select((.body // "") | contains("<!-- notion-page-id:")) | .number] | sort | .[0] // empty')"

          if [ -n "$first_number" ] && [ "$REQUESTED_PR" != "$first_number" ]; then
            echo "PR #$REQUESTED_PR attend : la PR #$first_number doit être traitée avant."
            exit 0
          fi

          echo "pr_number=$REQUESTED_PR" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

  test:
    name: Tester l'ancienne PR sans droit d'écriture
    needs: inspect
    if: needs.inspect.outputs.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Récupérer exactement la PR
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Préparer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Vérifier que la branche contient le dernier main
        run: |
          git fetch --no-tags origin main
          behind="$(git rev-list --count HEAD..origin/main)"
          if [ "$behind" != "0" ]; then
            echo "::error::La PR est encore en retard de $behind commit(s) sur main."
            exit 1
          fi

      - name: Figer le validateur depuis main puis tester la PR
        if: needs.inspect.outputs.manual_memory != 'true'
        run: |
          git show origin/main:scripts/validate_notion_change.py > /tmp/validate_notion_change.py
          chmod 500 /tmp/validate_notion_change.py
          python -I /tmp/validate_notion_change.py --base origin/main
          git diff --check origin/main...HEAD

      - name: Tester la correction mémoire manuelle sur données fictives
        if: needs.inspect.outputs.manual_memory == 'true'
        env:
          DATA_FILE: ${{ runner.temp }}/crm-memory-tests/data.json
          INTEGRALE_EDOF_CRM_SYNC_ENABLED: "false"
        run: |
          python -m pytest -q tests/test_crm_storage_memory.py tests/test_crm_memory_runtime.py tests/test_crm_memory_optimizations.py tests/test_crm_read_model_performance.py tests/test_dashboard_polling_memory.py tests/test_crm_workspace_loading.py
          python -m pytest -q tests/test_crm_wedof.py
          # This existing test predates Calendly's callback_checked identity
          # rule and also fails on main (ed007d5); it is unrelated to memory.
          python -m pytest -q tests/test_crm_performance_fix.py -k 'not test_local_orphan_is_visible_and_manual_refresh_repairs_phone_only_contact'
          git diff --check origin/main...HEAD

  publish:
    name: Publier l'ancienne PR validée
    needs: [inspect, test]
    if: needs.inspect.outputs.head_sha != '' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Revérifier la tête et fusionner sans forcer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
          EXPECTED_HEAD: ${{ needs.inspect.outputs.head_sha }}
          HEAD_REF: ${{ needs.inspect.outputs.head_ref }}
        run: |
          set -euo pipefail

          current="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json state,headRefOid,isDraft \
            --jq '[.state,.headRefOid,.isDraft] | @tsv')"
          state="$(printf '%s' "$current" | cut -f1)"
          current_head="$(printf '%s' "$current" | cut -f2)"
          is_draft="$(printf '%s' "$current" | cut -f3)"

          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR_NUMBER déjà fermée."
            exit 0
          fi
          if [ "$current_head" != "$EXPECTED_HEAD" ]; then
            echo "::error::La tête de la PR #$PR_NUMBER a changé après les tests."
            exit 1
          fi

          behind="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${HEAD_REF}" --jq '.behind_by')"
          if [ "$behind" != "0" ]; then
            echo "::error::La PR #$PR_NUMBER n'est plus à jour avec main."
            exit 1
          fi

          if [ "$is_draft" = "true" ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --match-head-commit "$EXPECTED_HEAD" \
            --delete-branch

          echo "PR historique #$PR_NUMBER fusionnée après validation complète."
