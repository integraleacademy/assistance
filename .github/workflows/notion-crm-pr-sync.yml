name: Notion CRM - synchroniser la PR

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  sync:
    name: Mettre à jour le statut Notion
    if: >-
      (startsWith(github.event.pull_request.head.ref, 'agent/notion-crm-') ||
       startsWith(github.event.pull_request.head.ref, 'work/notion-crm-')) &&
      contains(github.event.pull_request.body, '<!-- notion-page-id:')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Préparer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le client HTTP
        run: python -m pip install --disable-pip-version-check requests

      - name: Extraire la page Notion de la PR
        id: metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          body = os.environ.get('PR_BODY', '')
          match = re.search(r'<!--\s*notion-page-id:\s*([0-9a-fA-F-]{32,36})\s*-->', body)
          if not match:
              raise SystemExit('Aucun marqueur notion-page-id valide dans la PR.')
          compact = re.sub(r'[^0-9a-fA-F]', '', match.group(1)).lower()
          if len(compact) != 32:
              raise SystemExit('Identifiant Notion invalide.')
          page_id = f'{compact[:8]}-{compact[8:12]}-{compact[12:16]}-{compact[16:20]}-{compact[20:]}'
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as handle:
              handle.write(f'page_id={page_id}\n')
          PY

      - name: Marquer la demande comme publiée après fusion
        if: github.event.pull_request.merged == true
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          PAGE_ID: ${{ steps.metadata.outputs.page_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python notion_crm_automation.py update \
            --page-id "$PAGE_ID" \
            --status "Publié" \
            --pr-url "$PR_URL" \
            --branch "$BRANCH" \
            --run-url "$RUN_URL" \
            --clear-error \
            --comment "✅ La pull request a été fusionnée et publiée dans la branche principale : $PR_URL"

      - name: Signaler une fermeture sans fusion
        if: github.event.pull_request.merged != true
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          PAGE_ID: ${{ steps.metadata.outputs.page_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python notion_crm_automation.py update \
            --page-id "$PAGE_ID" \
            --status "En attente" \
            --pr-url "$PR_URL" \
            --branch "$BRANCH" \
            --run-url "$RUN_URL" \
            --error "La pull request a été fermée sans être fusionnée." \
            --comment "⚠️ La pull request a été fermée sans fusion. Une décision humaine est nécessaire : $PR_URL"
