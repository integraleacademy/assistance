name: Notion CRM - publier automatiquement les PR vertes

on:
  workflow_run:
    workflows: ["Notion CRM - vérifier les PR Work"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: notion-crm-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Fusionner la prochaine PR CRM validée
    if: >-
      github.repository == 'integraleacademy/assistance' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Vérifier puis fusionner sans jamais forcer
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [[ "$RUN_BRANCH" != work/notion-crm-* && "$RUN_BRANCH" != agent/notion-crm-* ]]; then
            echo "Branche hors automatisation CRM : $RUN_BRANCH"
            exit 0
          fi

          pr_json="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head "$RUN_BRANCH" \
            --limit 1 \
            --json number,headRefName,headRefOid,body,isDraft \
            --jq '.[0] // {}')"

          pr_number="$(printf '%s' "$pr_json" | jq -r '.number // ""')"
          head_sha="$(printf '%s' "$pr_json" | jq -r '.headRefOid // ""')"
          body="$(printf '%s' "$pr_json" | jq -r '.body // ""')"
          is_draft="$(printf '%s' "$pr_json" | jq -r '.isDraft // false')"

          if [ -z "$pr_number" ] || [ -z "$head_sha" ]; then
            echo "Aucune PR ouverte pour $RUN_BRANCH."
            exit 0
          fi

          if [[ "$body" != *"<!-- notion-page-id:"* ]]; then
            echo "PR #$pr_number sans marqueur Notion : aucune fusion automatique."
            exit 0
          fi

          first_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --limit 100 \
            --json number,headRefName,body \
            --jq '[.[] | select((.headRefName | startswith("work/notion-crm-")) or (.headRefName | startswith("agent/notion-crm-"))) | select((.body // "") | contains("<!-- notion-page-id:")) | .number] | sort | .[0] // empty')"

          if [ -n "$first_number" ] && [ "$pr_number" != "$first_number" ]; then
            echo "PR #$pr_number validée mais la PR #$first_number doit être publiée avant."
            exit 0
          fi

          compare_json="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${RUN_BRANCH}")"
          behind_by="$(printf '%s' "$compare_json" | jq -r '.behind_by // 999')"

          # Le compare GitHub est la source de vérité : behind_by=0 prouve que la
          # branche contient le main courant. Un statut custom séparé est redondant
          # et pouvait disparaître lorsqu'un correctif Work créait un nouveau SHA.
          if [ "$behind_by" != "0" ]; then
            echo "PR #$pr_number en retard de $behind_by commit(s) sur main : attente de l'actualisation automatique."
            exit 0
          fi

          current_head="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          if [ "$current_head" != "$head_sha" ]; then
            echo "La tête de la PR #$pr_number a changé depuis le CI ; une nouvelle validation est nécessaire."
            exit 0
          fi

          if [ "$is_draft" = "true" ]; then
            gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY"
          fi

          if gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --merge --delete-branch; then
            echo "PR #$pr_number fusionnée automatiquement après validation complète."
          else
            gh pr comment "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body '⚠️ La publication automatique n’a pas pu finaliser cette PR malgré un CI vert. Aucune fusion forcée n’a été effectuée. ChatGPT Work doit vérifier cette même PR avant de poursuivre.' || true
            exit 1
          fi
