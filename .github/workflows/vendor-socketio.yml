name: Vendor official Socket.IO client 4.8.1

on:
  push:
    branches:
      - fix/socketio-client-officiel-4.8.1
    paths:
      - .github/workflows/vendor-socketio.yml

permissions:
  contents: write

jobs:
  vendor-socketio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/socketio-client-officiel-4.8.1
          fetch-depth: 0

      - name: Download and verify the official Socket.IO client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static/vendor
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/socketio/socket.io/8d5528aa2abc530f9e35f53935083894cec38c99/packages/socket.io-client/dist/socket.io.min.js" \
            --output static/vendor/socket.io.min.js

          size="$(wc -c < static/vendor/socket.io.min.js | tr -d ' ')"
          test "$size" -gt 40000
          grep -Fq "Socket.IO v4.8.1" static/vendor/socket.io.min.js
          grep -Fq "Released under the MIT License" static/vendor/socket.io.min.js
          ! grep -Fq "Local Socket.IO v4-compatible client subset" static/vendor/socket.io.min.js
          ! grep -Fq "4.8-compatible-local" static/vendor/socket.io.min.js

          actual="$(openssl dgst -sha384 -binary static/vendor/socket.io.min.js | openssl base64 -A)"
          expected="mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+"
          echo "Socket.IO client size: ${size} bytes"
          echo "Socket.IO client SHA-384: ${actual}"
          test "$actual" = "$expected"

      - name: Commit the official vendor file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/vendor/socket.io.min.js
          if git diff --cached --quiet; then
            echo "Official file is already present."
            exit 0
          fi
          git commit -m "Vendor official Socket.IO client 4.8.1 [skip ci]"
          git push origin HEAD:fix/socketio-client-officiel-4.8.1
