<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Répondre - Intégrale Academy</title>
  <style>
    body {
      background-color: #f5f7fa;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 95%;
      max-width: 480px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    img.logo {
      max-width: 100px;
      margin-bottom: 15px;
    }
    h2 {
      margin-bottom: 10px;
      color: #0d6efd;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: vertical;
      font-size: 14px;
      margin-bottom: 12px;
    }
    input[type="file"] {
      margin: 10px 0;
      width: 100%;
    }
    button {
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #0b5ed7;
    }
    .file-label {
      display: block;
      text-align: left;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/static/logo.png" alt="Logo Intégrale Academy" class="logo">
    <h2>📩 Répondre à Intégrale Academy</h2>
    <p>Bonjour <strong>{{ demande.prenom }}</strong>, vous pouvez nous écrire directement ci-dessous :</p>

    <form method="POST" enctype="multipart/form-data">
      <textarea name="message" rows="5" placeholder="Votre message..." required></textarea>
      
      <label class="file-label">📎 Ajouter une pièce jointe (optionnel) :</label>
      <input type="file" name="pj" multiple>

      <button type="submit">Envoyer</button>
    </form>
  </div>
</body>
</html>
