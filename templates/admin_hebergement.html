<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Hébergement — Intégrale Academy</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background:#f5f6f8;
}

.container {
    max-width: 1500px !important;
}

.table-container {
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 6px 18px rgba(0,0,0,0.07);
}

.logo-admin {
    width:130px;
    margin-bottom:20px;
}

.btn-small {
    padding:4px 10px;
    font-size:13px;
}

.btn-pay {
    min-width: 90px;
}

.btn-mode {
    min-width: 90px;
}

/* ---------- Impression ---------- */
@media print {

    body {
        background:white !important;
    }

    /* On cache les boutons, formulaires, logo */
    button, .btn, form, .logo-admin, .d-flex, a {
        display:none !important;
    }

    h3 {
        text-align:center;
        margin:20px 0;
        font-size:24px;
    }

    .table-container {
        box-shadow:none !important;
        padding:0;
    }

    table {
        width:100% !important;
        font-size:14px;
    }

    th, td {
        border:1px solid #000 !important;
        padding:6px !important;
    }
}
</style>
</head>

<body class="p-4">

<div class="container">

    <!-- LOGO -->
    <div class="text-center">
        <img src="/static/logo.png" class="logo-admin">
    </div>

    <h3 class="text-center mb-4">Gestion des hébergements APR</h3>

    <!-- BARRE D'OUTILS -->
    <div class="d-flex justify-content-between mb-3">

        <!-- Recherche -->
        <form method="GET" action="/admin_hebergement" class="d-flex">
            <input type="text" name="q" class="form-control me-2" placeholder="Rechercher nom, email, session…">
            <button class="btn btn-primary">Rechercher</button>
        </form>

        <!-- Tri -->
        <a href="/admin_hebergement?tri=session" class="btn btn-secondary">Trier par session</a>

        <!-- Impression -->
        <button onclick="window.print()" class="btn btn-dark">🖨️ Imprimer la liste</button>
    </div>

    <div class="table-container">

        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Téléphone</th>
                    <th>Email</th>
                    <th>Session</th>
                    <th>Paiement</th>
                    <th>Mode</th>
                    <th>Date paiement</th>
                    <th>Supp.</th>
                </tr>
            </thead>

            <tbody>
                {% for h in hebergements %}
                <tr id="row-{{h.id}}">
                    <td>{{h.nom}}</td>
                    <td>{{h.prenom}}</td>
                    <td>{{h.telephone}}</td>
                    <td>{{h.mail}}</td>
                    <td>{{h.session}}</td>

                    <!-- Paiement -->
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-pay {% if h.paiement == 'Payé' %}btn-success{% else %}btn-outline-success{% endif %}"
                                    onclick="updatePaiement('{{h.id}}', 'Payé')">
                                🟢 Payé
                            </button>

                            <button class="btn btn-sm btn-pay {% if h.paiement != 'Payé' %}btn-danger{% else %}btn-outline-danger{% endif %}"
                                    onclick="updatePaiement('{{h.id}}', 'Non payé')">
                                🔴 Non payé
                            </button>
                        </div>
                    </td>

                    <!-- Mode paiement -->
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-mode {% if h.mode_paiement == 'Chèque' %}btn-secondary{% else %}btn-outline-secondary{% endif %}"
                                    onclick="updateMode('{{h.id}}', 'Chèque')">
                                🧾 Chèque
                            </button>

                            <button class="btn btn-sm btn-mode {% if h.mode_paiement == 'Espèces' %}btn-warning{% else %}btn-outline-warning{% endif %}"
                                    onclick="updateMode('{{h.id}}', 'Espèces')">
                                💶 Espèces
                            </button>
                        </div>
                    </td>

                    <!-- Date paiement -->
                    <td>{{h.date_paiement or ''}}</td>

                    <!-- Suppression -->
                    <td>
                        <form method="POST" action="/admin_hebergement">
                            <input type="hidden" name="id" value="{{h.id}}">
                            <input type="hidden" name="action" value="delete">
                            <button class="btn btn-danger btn-small">🗑️</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

</div>

<script>
function updatePaiement(id, value) {
    const formData = new FormData();
    formData.append("action", "paiement");
    formData.append("id", id);
    formData.append("value", value);

    fetch("/admin_hebergement", { method:"POST", body:formData });
}

function updateMode(id, value) {
    const formData = new FormData();
    formData.append("action", "mode");
    formData.append("id", id);
    formData.append("value", value);

    fetch("/admin_hebergement", { method:"POST", body:formData });
}
</script>

</body>
</html>
