<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Hébergement — Intégrale Academy</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background:#f5f6f8;
}

/* Conteneur global beaucoup plus large */
.container-admin {
    max-width: 1600px;
    margin:auto;
}

/* Logo */
.logo-admin {
    width:130px;
    margin-bottom:20px;
}

/* Zone du haut */
.top-bar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    gap:20px;
    flex-wrap:wrap;
}

.search-block {
    flex:1;
    min-width:280px;
}

.action-block {
    display:flex;
    gap:15px;
}

/* TABLE — pleine largeur */
.table-container {
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.07);
    width:100%;
}

.btn-pay, .btn-mode {
    min-width: 90px;
}

@media print {
    button, .btn, form, .logo-admin, .top-bar, a {
        display:none !important;
    }

    body {
        background:white !important;
    }

    table {
        width:100% !important;
        font-size:14px;
    }
}
</style>
</head>

<body class="p-4">

<div class="container-admin text-center">

    <!-- LOGO -->
    <img src="/static/logo.png" class="logo-admin">

    <h3 class="mb-4">Gestion des hébergements APR</h3>

    <!-- ZONE DU HAUT -->
    <div class="top-bar">

        <!-- Recherche -->
        <form method="GET" action="/admin_hebergement" class="search-block d-flex">
            <input type="text" name="q" class="form-control me-2"
                   placeholder="Rechercher nom, email, session…">
            <button class="btn btn-primary">Rechercher</button>
        </form>

        <!-- Actions -->
        <div class="action-block">
            <a href="/admin_hebergement?tri=session" class="btn btn-secondary">
                Trier par session
            </a>

            <button onclick="window.print()" class="btn btn-dark">
                🖨️ Imprimer la liste
            </button>
        </div>

    </div>

    <!-- TABLEAU FULL WIDTH -->
    <div class="table-container">

        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Téléphone</th>
                    <th>Email</th>
                    <th>Session</th>
                    <th>Paiement</th>
                    <th>Mode</th>

                    <!-- 🔑 Colonnes ajoutées -->
                    <th>Clé</th>
                    <th>État clé</th>

                    <th>Date paiement</th>
                    <th>Supp.</th>
                </tr>
            </thead>

            <tbody>
                {% for h in hebergements %}
                <tr id="row-{{h.id}}">
                    <td>{{h.nom}}</td>
                    <td>{{h.prenom}}</td>
                    <td>{{h.telephone}}</td>
                    <td>{{h.mail}}</td>
                    <td>{{h.session}}</td>

                    <!-- Paiement -->
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-pay {% if h.paiement == 'Payé' %}btn-success{% else %}btn-outline-success{% endif %}"
                                    onclick="updatePaiement('{{h.id}}', 'Payé')">
                                🟢 Payé
                            </button>

                            <button class="btn btn-sm btn-pay {% if h.paiement != 'Payé' %}btn-danger{% else %}btn-outline-danger{% endif %}"
                                    onclick="updatePaiement('{{h.id}}', 'Non payé')">
                                🔴 Non payé
                            </button>
                        </div>
                    </td>

                    <!-- Mode paiement -->
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm btn-mode {% if h.mode_paiement == 'Chèque' %}btn-secondary{% else %}btn-outline-secondary{% endif %}"
                                    onclick="updateMode('{{h.id}}', 'Chèque')">
                                🧾 Chèque
                            </button>

                            <button class="btn btn-sm btn-mode {% if h.mode_paiement == 'Espèces' %}btn-warning{% else %}btn-outline-warning{% endif %}"
                                    onclick="updateMode('{{h.id}}', 'Espèces')">
                                💶 Espèces
                            </button>
                        </div>
                    </td>

                    <!-- 🔑 Numéro de clé -->
                    <td>
                        <input type="text" class="form-control form-control-sm"
                               style="width:80px;"
                               value="{{ h.cle_numero or '' }}"
                               onchange="updateCleNumero('{{h.id}}', this.value)">
                    </td>

                    <!-- 🔑 État de la clé -->
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm 
                                {% if h.cle_etat == 'A donner' %}btn-primary{% else %}btn-outline-primary{% endif %}"
                                onclick="updateCleEtat('{{h.id}}', 'A donner')">
                                🟦 À donner
                            </button>

                            <button class="btn btn-sm 
                                {% if h.cle_etat == 'Donnee' %}btn-success{% else %}btn-outline-success{% endif %}"
                                onclick="updateCleEtat('{{h.id}}', 'Donnee')">
                                🟩 Donnée
                            </button>

                            <button class="btn btn-sm 
                                {% if h.cle_etat == 'Restituee' %}btn-warning{% else %}btn-outline-warning{% endif %}"
                                onclick="updateCleEtat('{{h.id}}', 'Restituee')">
                                🟧 Restituée
                            </button>
                        </div>
                    </td>

                    <td>{{h.date_paiement or ''}}</td>

                    <td>
                        <form method="POST" action="/admin_hebergement">
                            <input type="hidden" name="id" value="{{h.id}}">
                            <input type="hidden" name="action" value="delete">
                            <button class="btn btn-danger btn-sm">🗑️</button>
                        </form>
                    </td>

                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

</div>

<script>
function updatePaiement(id, value) {
    const formData = new FormData();
    formData.append("action", "paiement");
    formData.append("id", id);
    formData.append("value", value);
    fetch("/admin_hebergement", { method:"POST", body:formData })
        .then(() => location.reload());
}

function updateMode(id, value) {
    const formData = new FormData();
    formData.append("action", "mode");
    formData.append("id", id);
    formData.append("value", value);
    fetch("/admin_hebergement", { method:"POST", body:formData })
        .then(() => location.reload());
}

function updateCleNumero(id, value) {
    const formData = new FormData();
    formData.append("action", "cle_numero");
    formData.append("id", id);
    formData.append("value", value);
    fetch("/admin_hebergement", { method:"POST", body:formData })
        .then(() => location.reload());
}

function updateCleEtat(id, value) {
    const formData = new FormData();
    formData.append("action", "cle_etat");
    formData.append("id", id);
    formData.append("value", value);
    fetch("/admin_hebergement", { method:"POST", body:formData })
        .then(() => location.reload());
}
</script>

</body>
</html>
