<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin Hébergement — Intégrale Academy</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background:#f5f6f8;
}

/* ————————————————
   CONTENEUR GLOBAL
——————————————— */
.container-admin {
    max-width: 1650px;
    margin:auto;
}

/* Logo */
.logo-admin {
    width:130px;
    margin-bottom:20px;
}

/* Top bar */
.top-bar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    gap:20px;
    flex-wrap:wrap;
}

/* ————————————————
   TABLE COMPACT
——————————————— */
.table-container {
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.07);
    width:100%;
}

.table th, .table td {
    padding:6px 8px !important;
    font-size:14px;
    vertical-align:middle;
}

/* Session large */
.col-session {
    max-width:220px;
    white-space:normal !important;
}

/* Numéro de clé */
.key-input {
    width:60px !important;
    padding:3px 4px;
    font-size:14px;
}

/* ————————————————
   ALTERNANCE LIGNES (gris/blanc)
——————————————— */
.table tbody tr:nth-child(odd) {
    background-color:#f7f7f7 !important;
}
.table tbody tr:nth-child(even) {
    background-color:#ffffff !important;
}

.table tbody tr:hover {
    background:#e9ecef !important;
}

/* ————————————————
   BOUTONS ÉTAT DES CLÉS
——————————————— */
.btn-etat {
    padding:4px 10px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    border:1px solid #ccc;
    background:#f8f8f8;
    cursor:pointer;
}

.btn-etat.active { color:white; }

.btn-etat.adonner.active {
    background:#6c757d;
    border-color:#6c757d;
}

.btn-etat.donnee.active {
    background:#0d6efd;
    border-color:#0d6efd;
}

.btn-etat.restituee.active {
    background:#F4C45A;
    border-color:#F4C45A;
    color:black !important;
}

/* Impression */
@media print {
    button, .btn, form, .logo-admin, .top-bar, a {
        display:none !important;
    }
    body { background:white !important; }
    table { width:100% !important; font-size:14px; }
}
</style>
</head>

<body class="p-4">

<div class="container-admin text-center">

    <!-- LOGO -->
    <img src="/static/logo.png" class="logo-admin">

    <h3 class="mb-4">Gestion des hébergements APR</h3>

    <!-- ZONE DU HAUT -->
    <div class="top-bar">

        <!-- Recherche -->
        <form method="GET" action="/admin_hebergement" class="search-block d-flex" style="flex:1;min-width:280px;">
            <input type="text" name="q" class="form-control me-2"
                   placeholder="Rechercher nom, email, session…">
            <button class="btn btn-primary">Rechercher</button>
        </form>

        <!-- Actions -->
        <div class="d-flex gap-2">
            <a href="/admin_hebergement?tri=session" class="btn btn-secondary">
                Trier par session
            </a>
            <button onclick="window.print()" class="btn btn-dark">
                🖨️ Imprimer
            </button>
        </div>

    </div>

    <!-- TABLEAU -->
    <div class="table-container">

        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Téléphone</th>
                    <th>Email</th>
                    <th class="col-session">Session</th>
                    <th>Paiement</th>
                    <th>Mode</th>
                    <th>Clé</th>
                    <th>État clé</th>
                    <th>Date paiement</th>
                    <th>Supp.</th>
                </tr>
            </thead>

            <tbody>
                {% for h in hebergements %}
                <tr id="row-{{h.id}}">

                    <td>{{h.nom}}</td>
                    <td>{{h.prenom}}</td>

                    <td>
                        <a href="tel:{{h.telephone}}" class="text-success fw-bold">
                            {{h.telephone}}
                        </a>
                    </td>

                    <td>{{h.mail}}</td>

                    <td class="col-session">{{h.session}}</td>

                    <!-- Paiement -->
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm {% if h.paiement == 'Payé' %}btn-success{% else %}btn-outline-success{% endif %}"
                                    onclick="updatePaiement('{{h.id}}', 'Payé')">
                                Payé
                            </button>

                            <button class="btn btn-sm {% if h.paiement != 'Payé' %}btn-danger{% else %}btn-outline-danger{% endif %}"
                                    onclick="updatePaiement('{{h.id}}', 'Non payé')">
                                Non payé
                            </button>
                        </div>
                    </td>

                    <!-- Mode paiement -->
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-sm {% if h.mode_paiement == 'Chèque' %}btn-secondary{% else %}btn-outline-secondary{% endif %}"
                                    onclick="updateMode('{{h.id}}', 'Chèque')">
                                Chèque
                            </button>

                            <button class="btn btn-sm {% if h.mode_paiement == 'Espèces' %}btn-warning{% else %}btn-outline-warning{% endif %}"
                                    onclick="updateMode('{{h.id}}', 'Espèces')">
                                Espèces
                            </button>
                        </div>
                    </td>

                    <!-- Numéro de clé -->
                    <td>
                        <input type="text" class="key-input"
                               value="{{ h.cle_numero or '' }}"
                               onchange="updateCleNumero('{{h.id}}', this.value)">
                    </td>

                    <!-- État clé -->
                    <td>
                        <div class="d-flex gap-1">
                            <button 
                                class="btn-etat adonner {% if h.cle_etat == 'A donner' %}active{% endif %}"
                                onclick="updateCleEtat('{{h.id}}', 'A donner')">
                                À donner
                            </button>

                            <button 
                                class="btn-etat donnee {% if h.cle_etat == 'Donnee' %}active{% endif %}"
                                onclick="updateCleEtat('{{h.id}}', 'Donnee')">
                                Donnée
                            </button>

                            <button 
                                class="btn-etat restituee {% if h.cle_etat == 'Restituee' %}active{% endif %}"
                                onclick="updateCleEtat('{{h.id}}', 'Restituee')">
                                Restituée
                            </button>
                        </div>
                    </td>

                    <!-- Date paiement -->
                    <td>{{h.date_paiement or ''}}</td>

                    <!-- Supprimer -->
                    <td>
                        <form method="POST" action="/admin_hebergement">
                            <input type="hidden" name="id" value="{{h.id}}">
                            <input type="hidden" name="action" value="delete">
                            <button class="btn btn-danger btn-sm">🗑️</button>
                        </form>
                    </td>

                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

</div>

<script>
function updatePaiement(id, value) {
    const fd = new FormData();
    fd.append("action", "paiement");
    fd.append("id", id);
    fd.append("value", value);
    fetch("/admin_hebergement", { method:"POST", body:fd })
        .then(() => location.reload());
}

function updateMode(id, value) {
    const fd = new FormData();
    fd.append("action", "mode");
    fd.append("id", id);
    fd.append("value", value);
    fetch("/admin_hebergement", { method:"POST", body:fd })
        .then(() => location.reload());
}

function updateCleNumero(id, value) {
    const fd = new FormData();
    fd.append("action", "cle_numero");
    fd.append("id", id);
    fd.append("value", value);
    fetch("/admin_hebergement", { method:"POST", body:fd })
        .then(() => location.reload());
}

function updateCleEtat(id, value) {
    const fd = new FormData();
    fd.append("action", "cle_etat");
    fd.append("id", id);
    fd.append("value", value);
    fetch("/admin_hebergement", { method:"POST", body:fd })
        .then(() => location.reload());
}
</script>

</body>
</html>
