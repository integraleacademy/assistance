<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Merci pour votre réponse - Intégrale Academy</title>
  <style>
    body {
      background: #f7f7f7;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #fff;
      padding: 25px 20px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 500px;
      animation: fadeIn 0.5s ease;
      text-align: center;
    }
    .logo {
      max-width: 100px;
      display: block;
      margin: 0 auto 15px;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 20px;
      color: #198754;
    }
    p {
      color: #444;
      font-size: 15px;
      margin: 8px 0 18px;
    }
    .btn {
      display: inline-block;
      padding: 12px 20px;
      background: #0d6efd;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      font-size: 15px;
      text-decoration: none;
      margin-top: 10px;
    }
    .btn:hover {
      background: #0b5ed7;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* ✅ Responsive */
    @media (max-width: 480px) {
      .card {
        padding: 20px 15px;
        max-width: 95%;
      }
      h2 { font-size: 18px; }
      p { font-size: 14px; }
      .btn { font-size: 14px; padding: 10px 16px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <!-- ✅ Logo -->
      <img src="/static/logo.png" alt="Logo Intégrale Academy" class="logo">

      <!-- ✅ Titre merci -->
      <h2>💌 Merci pour votre réponse</h2>
      <p>Votre message a bien été transmis à notre équipe.<br>
         Nous reviendrons vers vous dès que possible.</p>

      <!-- ✅ Bouton retour -->
      <a href="/" class="btn">⬅️ Retour à l’accueil</a>
    </div>
  </div>
</body>
</html>
