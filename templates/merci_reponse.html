<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Répondre à Intégrale Academy</title>
  <style>
    body {
      background: #f7f7f7;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #fff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      max-width: 550px;
      width: 100%;
      animation: fadeIn 0.5s ease;
    }
    .logo {
      max-width: 120px;
      display: block;
      margin: 0 auto 15px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 22px;
      color: #0d6efd;
      text-align: center;
    }
    p {
      color: #444;
      font-size: 15px;
      margin: 8px 0 20px;
      text-align: center;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
      min-height: 120px;
      font-size: 14px;
      margin-bottom: 15px;
    }
    .file-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #555;
      margin-bottom: 15px;
    }
    .file-group input[type="file"] {
      flex: 1;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #0d6efd;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      font-size: 15px;
    }
    .btn:hover {
      background: #0b5ed7;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <img src="/static/logo.png" alt="Logo Intégrale Academy" class="logo">
      <h2>📩 Répondre à Intégrale Academy</h2>
      <p>Bonjour <strong>{{ demande.prenom|upper }}</strong>, vous pouvez nous écrire directement ci-dessous :</p>

      <form method="POST" enctype="multipart/form-data">
        <textarea name="message" placeholder="Votre message..." required></textarea>

        <div class="file-group">
          <span>📎 Ajouter une pièce jointe (optionnel) :</span>
          <input type="file" name="pj" multiple>
        </div>

        <button type="submit" class="btn">Envoyer</button>
      </form>
    </div>
  </div>
</body>
</html>
