<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demande d'assistance - Intégrale Academy</title>
  <style>
    body {
      background-color: #fdfaf5;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    img.logo {
      max-width: 120px;
      margin-bottom: 15px;
    }
    h2 {
      color: #0d6efd;
      margin-bottom: 10px;
      font-size: 22px;
    }
    h3 {
      margin-bottom: 20px;
      color: #555;
      font-size: 15px;
    }
    label {
      display: block;
      text-align: left;
      margin: 10px 0 5px;
      font-weight: bold;
      font-size: 14px;
    }
    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px; /* ✅ empêche zoom iOS */
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      line-height: 1.4;
    }
    button {
      background-color: #0d6efd;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #0b5ed7;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/static/logo.png" alt="Logo Intégrale Academy" class="logo">
    <h2>📋 Demande d'assistance</h2>
    <h3>Merci de compléter les informations ci-dessous :</h3>
    <p><a href="{{ url_for('poei_agent_securite_cannes') }}" style="display:inline-block;margin:0 0 14px;padding:10px 14px;border-radius:999px;background:#edf7f1;color:#123c2f;text-decoration:none;font-weight:bold;">Formation + emploi Cannes</a></p>
    <form method="POST" enctype="multipart/form-data">
      <label>Nom :</label>
      <input type="text" name="nom" required>
      <label>Prénom :</label>
      <input type="text" name="prenom" required>
      <label>Téléphone :</label>
      <input type="text" name="telephone" required>
      <label>Email :</label>
      <input type="email" name="mail" required>
      <label>Motif de la demande :</label>
      <select name="motif" id="motif" required onchange="toggleJustificatif()">
        <option value="Attestation">Demande d’attestation / certificat</option>
        <option value="Diplome">Demande de diplôme</option>
        <option value="Absence">Absence(s)</option>
        <option value="Contrats">Contrat d'apprentissage</option>
        <option value="Autre">Autre demande</option>
      </select>

      <div id="justificatifDiv" style="display:none; margin-top:15px;">
        <label>Justificatif d’absence (PDF ou image) :</label>
        <input type="file" name="justificatif" accept=".pdf,.jpg,.jpeg,.png">
      </div>

      <div id="photoIdentiteDiv" style="display:none; margin-top:15px;">
        <label>Photo d’identité (JPG ou PNG) :</label>
        <input type="file" name="photo_identite" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
        <small style="display:block;text-align:left;margin-top:-10px;margin-bottom:15px;color:#666;line-height:1.35;">
          Pour un diplôme SSIAP, la photo sera automatiquement placée en haut à droite au format officiel 35&nbsp;mm × 45&nbsp;mm.
        </small>
      </div>

      <label>Votre demande (détails) :</label>
      <textarea name="details" rows="4" required></textarea>

      <button type="submit">Envoyer ma demande</button>
    </form>
  </div>

  <script>
    // Afficher le champ justificatif uniquement pour "Absence"
    function toggleJustificatif() {
      let motif = document.getElementById("motif").value;
      let justificatifDiv = document.getElementById("justificatifDiv");
      let photoIdentiteDiv = document.getElementById("photoIdentiteDiv");
      justificatifDiv.style.display = (motif === "Absence") ? "block" : "none";
      photoIdentiteDiv.style.display = (motif === "Diplome") ? "block" : "none";
    }

    // ✅ Fix iOS : empêche le zoom et les remontées automatiques
    document.querySelectorAll("input, textarea, select").forEach(el => {
      el.addEventListener("focus", () => {
        setTimeout(() => {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 300);
      });
    });
  </script>
</body>
</html>
