<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Réservation confirmée</title>
  <style>
    body {
      background:#fdfaf5;
      font-family:Arial;
      padding:40px;
      text-align:center;
    }
    .box {
      max-width:500px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:15px;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }
    h2 {color:#198754;}
    button {
      margin-top:20px;
      padding:12px 18px;
      border:none;
      border-radius:8px;
      background:#0d6efd;
      color:white;
      cursor:pointer;
      font-size:16px;
    }
    button:hover {
      background:#0b5ed7;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>🎉 Votre réservation est confirmée</h2>
    <p>Merci ! Votre demande de réservation d’hébergement a bien été prise en compte.</p>
    <p>Un e-mail de confirmation vous a été envoyé.</p>

    <button onclick="window.location='/'">Retour au site</button>
  </div>
</body>
</html>
