<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choisir mon centre de formation</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f9; margin:0; color:#1f2937; }
    .wrap { max-width: 860px; margin: 36px auto; background:#fff; border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.08); padding:26px; }
    h1 { margin: 0 0 10px; font-size:36px; text-align:center; }
    .muted { color:#6b7280; }
    .brand { display:flex; justify-content:center; align-items:center; margin-bottom:16px; }
    .brand img { height:96px; width:auto; border-radius:16px; box-shadow:0 8px 20px rgba(37,99,235,.2); }
    .intro { text-align:center; margin-bottom:20px; }

    .section-note {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #e0e7ff;
      background: linear-gradient(90deg, #eff6ff 0%, #ecfeff 100%);
      font-weight: 600;
      color: #1e3a8a;
      text-align: center;
    }

    .choice-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .choice-btn {
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      color: #1e3a8a;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }

    .choice-btn:hover { transform: translateY(-2px); box-shadow:0 8px 20px rgba(59,130,246,.15); }
    .choice-btn.active { border-color:#2563eb; background:#dbeafe; }

    .direct-select { margin-top: 14px; }
    .direct-select label { display:block; margin-bottom:8px; font-weight:600; color:#1e3a8a; }
    select {
      width:100%;
      padding:12px;
      border:1px solid #d1d5db;
      border-radius:10px;
      font-size:16px;
      background:#fff;
    }

    .row { display:flex; gap:12px; margin:18px 0 8px; }
    input { flex:1; padding:12px; border:1px solid #d1d5db; border-radius:10px; font-size:16px; }
    button { background:#2563eb; color:#fff; border:0; border-radius:10px; padding:12px 18px; font-size:16px; cursor:pointer; }
    #btn {
      min-width: 120px;
      animation: pulse 1.8s infinite;
      box-shadow: 0 10px 20px rgba(37,99,235,.25);
      transition: transform .2s ease, background .2s ease;
    }
    #btn:hover { background:#1d4ed8; transform: translateY(-1px); }
    #btn:disabled { animation:none; opacity:.8; cursor:wait; }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37,99,235,.45); }
      70% { transform: scale(1.03); box-shadow: 0 0 0 12px rgba(37,99,235,0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37,99,235,0); }
    }

    .box { margin-top:18px; padding:14px; border-radius:10px; background:#f9fafb; border:1px solid #e5e7eb; }
    .result { margin-top:20px; padding:16px; border-radius:10px; border:2px solid #bfdbfe; background:#eff6ff; }
    .selection { margin-top:14px; padding:16px; border-radius:10px; border:1px solid #bfdbfe; background:#f0f9ff; }
    .ok { color:#065f46; font-weight:700; }
    .error { color:#b91c1c; font-weight:600; }
    .back {
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-top:18px;
      text-decoration:none;
      color:#1d4ed8;
      background:#eff6ff;
      border:1px solid #bfdbfe;
      border-radius:999px;
      padding:10px 16px;
      font-weight:700;
      transition: all .2s ease;
    }
    .back:hover { background:#dbeafe; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo Intégrale Academy">
    </div>
    <h1>📍 Choisir mon centre de formation</h1>
    <p class="muted intro">Renseignez votre code postal afin que nous puissions vous aider à trouver le centre de formation le plus proche de chez vous.</p>

    <div class="row">
      <input id="cp" type="text" maxlength="5" placeholder="Ex : 06000" inputmode="numeric" />
      <button id="btn">Calculer</button>
    </div>

    <div id="location" class="box" style="display:none;"></div>
    <div id="distances" class="box" style="display:none;"></div>
    <div id="result" class="result" style="display:none;"></div>

    <div class="section-note" id="preference-note" style="display:none;">🌊 Vous êtes plutôt mer ou plutôt montagne ? 🏔️ Faites votre choix !</div>

    <div class="choice-row" id="preference-row" style="display:none;">
      <button class="choice-btn" type="button" data-pref="mer">🌊 Team Mer</button>
      <button class="choice-btn" type="button" data-pref="montagne">🏔️ Team Montagne</button>
    </div>

    <div class="direct-select" id="direct-select-wrap" style="display:none;">
      <label for="center-select">Ou sélectionnez directement votre centre :</label>
      <select id="center-select">
        <option value="auto">🔎 Je garde le centre recommandé</option>
        <option value="cote-azur">🌊 Intégrale Academy Côte d'Azur</option>
        <option value="auvergne">🏔️ Intégrale Academy Terres d'Auvergne</option>
      </select>
    </div>

    <div id="selection" class="selection" style="display:none;"></div>
    <div id="error" class="box error" style="display:none;"></div>

    <a class="back" href="{{ url_for('demande_informations_formations') }}" target="_top">← Retour au formulaire</a>
  </div>

  <script>
    const CENTER_COTE_AZUR = {
      key: 'cote-azur',
      name: "Intégrale Academy Côte d'Azur",
      address: "54 chemin du Carreou, 83480 Puget-sur-Argens"
    };

    const CENTER_AUVERGNE = {
      key: 'auvergne',
      name: "Intégrale Academy Terres d'Auvergne",
      address: "650 route d'Aumont, 15130 Arpajon-sur-Cère"
    };

    const cpInput = document.getElementById('cp');
    const btn = document.getElementById('btn');
    const locationBox = document.getElementById('location');
    const distancesBox = document.getElementById('distances');
    const resultBox = document.getElementById('result');
    const selectionBox = document.getElementById('selection');
    const errorBox = document.getElementById('error');
    const centerSelect = document.getElementById('center-select');
    const prefButtons = document.querySelectorAll('.choice-btn');
    const preferenceNote = document.getElementById('preference-note');
    const preferenceRow = document.getElementById('preference-row');
    const directSelectWrap = document.getElementById('direct-select-wrap');

    let latestDistances = null;
    let recommendedCenter = null;

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    function hideError() {
      errorBox.style.display = 'none';
      errorBox.textContent = '';
    }

    function notifyParent(center) {
      window.parent.postMessage({
        type: 'centre-selected',
        centre: center.key === 'cote-azur' ? 'cote_azur' : 'auvergne'
      }, '*');
    }

    function updateSelectionSummary(center, reason) {
      if (!latestDistances || !center) return;
      const distance = latestDistances[center.key];
      selectionBox.innerHTML = `✅ <strong>${reason}</strong><br>Centre sélectionné : <span class="ok">${center.name}</span><br><span class="muted">Distance estimée : ${distance.toFixed(1)} km</span>`;
      selectionBox.style.display = 'block';
    }

    function activatePreference(pref, shouldNotify = true) {
      prefButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.pref === pref);
      });

      if (pref === 'mer') {
        centerSelect.value = CENTER_COTE_AZUR.key;
        updateSelectionSummary(CENTER_COTE_AZUR, 'Choix Team Mer 🌊');
        if (shouldNotify) notifyParent(CENTER_COTE_AZUR);
      } else if (pref === 'montagne') {
        centerSelect.value = CENTER_AUVERGNE.key;
        updateSelectionSummary(CENTER_AUVERGNE, 'Choix Team Montagne 🏔️');
        if (shouldNotify) notifyParent(CENTER_AUVERGNE);
      }
    }

    prefButtons.forEach((button) => {
      button.addEventListener('click', () => activatePreference(button.dataset.pref));
    });

    centerSelect.addEventListener('change', () => {
      if (centerSelect.value === 'auto') {
        prefButtons.forEach((button) => button.classList.remove('active'));
        if (recommendedCenter) {
          updateSelectionSummary(recommendedCenter, 'Centre recommandé conservé');
          notifyParent(recommendedCenter);
        }
      } else if (centerSelect.value === CENTER_COTE_AZUR.key) {
        activatePreference('mer');
      } else if (centerSelect.value === CENTER_AUVERGNE.key) {
        activatePreference('montagne');
      }
    });

    function haversineKm(lat1, lon1, lat2, lon2) {
      const toRad = (deg) => deg * Math.PI / 180;
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    async function geocodeAddress(address) {
      const url = `https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(address)}&limit=1`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('Impossible de géocoder une adresse centre.');
      const data = await resp.json();
      if (!data.features || !data.features.length) throw new Error(`Adresse introuvable: ${address}`);
      const [lon, lat] = data.features[0].geometry.coordinates;
      return { lat, lon };
    }

    async function findCityByPostalCode(postcode) {
      const url = `https://geo.api.gouv.fr/communes?codePostal=${encodeURIComponent(postcode)}&fields=nom,centre,code,codesPostaux&format=json`;
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('Impossible de récupérer la ville depuis le code postal.');
      const data = await resp.json();
      if (!Array.isArray(data) || !data.length) throw new Error('Aucune ville trouvée pour ce code postal.');

      const city = data[0];
      if (!city.centre || !city.centre.coordinates) throw new Error('Coordonnées de la ville indisponibles.');
      const [lon, lat] = city.centre.coordinates;

      return { cityName: city.nom, postcode, lat, lon };
    }

    async function run() {
      hideError();
      locationBox.style.display = 'none';
      distancesBox.style.display = 'none';
      resultBox.style.display = 'none';
      selectionBox.style.display = 'none';

      const postcode = cpInput.value.trim();
      if (!/^\d{5}$/.test(postcode)) {
        showError('Veuillez saisir un code postal français valide (5 chiffres).');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Calcul...';

      try {
        const personLocation = await findCityByPostalCode(postcode);

        locationBox.innerHTML = `📌 Localisation détectée : <strong>${personLocation.cityName} (${personLocation.postcode})</strong>`;
        locationBox.style.display = 'block';

        const [coteAzurCoords, auvergneCoords] = await Promise.all([
          geocodeAddress(CENTER_COTE_AZUR.address),
          geocodeAddress(CENTER_AUVERGNE.address)
        ]);

        const dAzur = haversineKm(personLocation.lat, personLocation.lon, coteAzurCoords.lat, coteAzurCoords.lon);
        const dAuvergne = haversineKm(personLocation.lat, personLocation.lon, auvergneCoords.lat, auvergneCoords.lon);

        distancesBox.innerHTML = `
          <div>📏 Distance vers <strong>${CENTER_COTE_AZUR.name}</strong> : <strong>${dAzur.toFixed(1)} km</strong></div>
          <div>📏 Distance vers <strong>${CENTER_AUVERGNE.name}</strong> : <strong>${dAuvergne.toFixed(1)} km</strong></div>
        `;
        distancesBox.style.display = 'block';

        latestDistances = {
          [CENTER_COTE_AZUR.key]: dAzur,
          [CENTER_AUVERGNE.key]: dAuvergne
        };

        const nearest = dAzur <= dAuvergne ? CENTER_COTE_AZUR : CENTER_AUVERGNE;
        const nearestDistance = dAzur <= dAuvergne ? dAzur : dAuvergne;
        recommendedCenter = nearest;

        resultBox.innerHTML = `✅ <strong>Centre recommandé</strong><br><span class="ok">${nearest.name}</span><br><span class="muted">Distance estimée : ${nearestDistance.toFixed(1)} km</span>`;
        resultBox.style.display = 'block';

        preferenceNote.style.display = 'block';
        preferenceRow.style.display = 'grid';
        directSelectWrap.style.display = 'block';
        centerSelect.value = 'auto';
        prefButtons.forEach((button) => button.classList.remove('active'));
        updateSelectionSummary(recommendedCenter, 'Centre recommandé conservé');
        notifyParent(recommendedCenter);
      } catch (e) {
        showError(e.message || 'Une erreur est survenue.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Calculer';
      }
    }

    btn.addEventListener('click', run);
    cpInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        run();
      }
    });
  </script>
</body>
</html>
