<link rel="stylesheet" href="{{ url_for('static', filename='chat.css', v='20260804') }}">
<div id="integrale-chat" class="ic-chat" data-state="closed">
  <button class="ic-launcher" type="button" aria-label="Ouvrir le chat interne" aria-expanded="false">💬<span class="ic-total" hidden>0</span></button>
  <section class="ic-panel" aria-label="Chat interne" aria-hidden="true">
    <header><div><strong>Chat équipe</strong><small class="ic-online">Connexion…</small></div><button class="ic-sound" aria-label="Désactiver le son">🔔</button><button class="ic-close" aria-label="Réduire le chat">−</button></header>
    <p class="ic-connection" role="status">Connexion…</p>
    <div class="ic-home">
      <button class="ic-team ic-row" type="button"><span class="ic-avatar">É</span><span><strong>Équipe</strong><small>Salon général</small></span><b class="ic-badge" hidden>0</b></button>
      <div class="ic-heading"><strong>Discussions</strong><button class="ic-new" type="button">Nouvelle discussion</button></div>
      <div class="ic-directs"></div><div class="ic-heading"><strong>Collègues</strong></div><div class="ic-colleagues"></div>
    </div>
    <div class="ic-conversation" hidden>
      <div class="ic-conv-head"><button class="ic-back" aria-label="Retour">←</button><div><strong class="ic-conv-title"></strong><small class="ic-conv-status"></small></div></div>
      <div class="ic-messages" role="log" aria-live="polite"><button class="ic-older" hidden>Charger les messages précédents</button></div>
      <div class="ic-typing" aria-live="polite"></div>
      <form class="ic-compose"><textarea maxlength="2000" rows="1" aria-label="Votre message" placeholder="Écrire un message…"></textarea><button type="submit" aria-label="Envoyer">➤</button></form>
    </div>
  </section>
</div>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js" defer></script>
<script src="{{ url_for('static', filename='chat.js', v='20260804') }}" defer></script>
