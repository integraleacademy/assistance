<link rel="stylesheet" href="{{ url_for('static', filename='chat.css', v=chat_asset_version) }}">
<div id="integrale-chat" class="ic-chat" data-state="closed" data-asset-version="{{ chat_asset_version }}">
<button class="ic-launcher" type="button" aria-label="Ouvrir le chat interne" aria-expanded="false">💬<span class="ic-total" hidden>0</span></button>
<section class="ic-panel" aria-label="Chat interne" aria-hidden="true">
<header><div><strong>Chat équipe</strong><small class="ic-online">Connexion au chat…</small></div><button class="ic-sound" type="button" aria-label="Désactiver le son">🔔</button><button class="ic-close" type="button" aria-label="Fermer le chat">−</button></header>
<p class="ic-connection show" role="status">Connexion au chat…</p><div class="ic-notice" role="alert" hidden><span></span><button type="button" class="ic-retry">Réessayer</button></div>
<div class="ic-home"><button class="ic-team ic-row" type="button"><span class="ic-avatar">É</span><span><strong>Équipe</strong><small>Salon général</small></span><b class="ic-badge" hidden>0</b></button><div class="ic-heading"><strong>Discussions</strong><button class="ic-new" type="button">Nouvelle discussion</button></div><div class="ic-directs"></div><div class="ic-heading"><strong>Collègues</strong></div><div class="ic-colleagues"></div></div>
<div class="ic-conversation" hidden><div class="ic-conv-head"><button class="ic-back" type="button" aria-label="Retour">←</button><div><strong class="ic-conv-title"></strong><small class="ic-conv-status"></small></div><button class="ic-clear" type="button" aria-label="Supprimer tout l’historique">Supprimer l’historique</button></div><div class="ic-messages" role="log" aria-live="polite"><button class="ic-older" type="button" hidden>Charger les messages précédents</button></div><div class="ic-typing" aria-live="polite"></div><form class="ic-compose"><textarea maxlength="2000" rows="1" aria-label="Votre message" placeholder="Écrire un message…"></textarea><button type="submit" aria-label="Envoyer">➤</button></form></div>
<div class="ic-modal" role="dialog" aria-modal="true" aria-labelledby="ic-modal-title" hidden><div class="ic-modal-card"><div class="ic-modal-head"><strong id="ic-modal-title">Nouvelle discussion</strong><button class="ic-modal-close" type="button" aria-label="Fermer">×</button></div><label>Rechercher un collègue<input class="ic-search" type="search" placeholder="Nom ou adresse e-mail"></label><div class="ic-picker"></div><p class="ic-empty" hidden>Aucun collègue ne correspond.</p></div></div>
</section></div>
<script src="{{ url_for('static', filename='vendor/socket.io.min.js', v=chat_asset_version) }}" defer></script><script src="{{ url_for('static', filename='chat.js', v=chat_asset_version) }}" defer></script>
