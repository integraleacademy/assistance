<aside class="desk-agenda" aria-label="Rendez-vous téléphoniques">
  <section class="agenda-card" id="deskAgenda" data-today="{{ desk_today }}">
    <h2 class="agenda-heading">
      <button type="button" id="agendaToggle" aria-controls="agendaPanel" aria-expanded="true">
        <span class="agenda-icon">{{ icon('calendar') }}</span>
        <span><strong>Agenda téléphonique</strong><small id="agendaCaption">Aujourd’hui</small></span>
        <span class="agenda-caret" aria-hidden="true"></span>
      </button>
    </h2>
    <div class="agenda-body" id="agendaPanel">
      {% if desk_role %}
      <div class="agenda-controls">
        <div class="agenda-toolbar">
        <div class="agenda-navigation">
          <button type="button" id="agendaPrevious" aria-label="Jour précédent">{{ icon('chevron') }}</button>
          <label class="sr-only" for="agendaDay">Jour des rendez-vous</label>
          <input type="date" id="agendaDay" value="{{ desk_today }}">
          <button type="button" id="agendaNext" aria-label="Jour suivant">{{ icon('chevron') }}</button>
        </div>
        <div class="agenda-actions"><button type="button" id="agendaToday">Aujourd’hui</button><button type="button" id="agendaRefresh" aria-label="Actualiser l’agenda" title="Actualiser l’agenda"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7.5A7 7 0 0 1 18 7l2 3M4 14l2 3a7 7 0 0 0 11.9-.5"/></svg></button></div>
        </div>
        <div id="agendaSearchBox" hidden><label class="sr-only" for="agendaSearch">Rechercher un nom ou une heure</label><input type="search" id="agendaSearch" placeholder="Rechercher un nom ou une heure"></div>
        <div class="agenda-count"><p id="agendaStatus" role="status" aria-live="polite"></p><small>Heure de Paris</small></div>
      </div>
      <ol id="agendaList" tabindex="0" aria-label="Rendez-vous de la journée"></ol>
      <div class="agenda-foot">
        <small id="agendaSync" hidden></small>
        {% if desk_role == 'internal' %}<a id="agendaCrm" href="{{ url_for('crm', section='calendrier', date=desk_today) }}" target="_blank" rel="noopener">Voir dans le CRM <span aria-hidden="true">↗</span></a>{% endif %}
        <a id="agendaReconnect" class="btn secondary" href="{{ url_for('login', next='/secretariat') }}" hidden>Se reconnecter</a>
      </div>
      {% else %}
      <div class="agenda-access"><p>Connectez-vous pour consulter les rendez-vous et leur résultat.</p><a class="btn secondary" href="{{ url_for('login', next='/secretariat') }}">Se connecter</a></div>
      {% endif %}
    </div>
  </section>
</aside>
