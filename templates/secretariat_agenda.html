<aside class="desk-agenda" aria-label="Rendez-vous téléphoniques">
  <details id="deskAgenda" open data-today="{{ desk_today }}">
    <summary><span class="agenda-icon">{{ icon('calendar') }}</span><span><strong>Agenda téléphonique</strong><small id="agendaCaption">Aujourd’hui · heure de Paris</small></span><span class="agenda-caret" aria-hidden="true"></span></summary>
    {% if desk_role %}
    <div class="agenda-body">
      <div class="agenda-navigation">
        <button type="button" id="agendaPrevious" aria-label="Jour précédent">{{ icon('chevron') }}</button>
        <label class="sr-only" for="agendaDay">Jour des rendez-vous téléphoniques</label>
        <input type="date" id="agendaDay" value="{{ desk_today }}">
        <button type="button" id="agendaNext" aria-label="Jour suivant">{{ icon('chevron') }}</button>
      </div>
      <small class="agenda-timezone">Heure de Paris</small>
      <div class="agenda-actions"><button type="button" id="agendaToday">Aujourd’hui</button><button type="button" id="agendaRefresh">Actualiser</button></div>
      <div id="agendaSearchBox" hidden><label class="sr-only" for="agendaSearch">Rechercher un nom ou une heure</label><input type="search" id="agendaSearch" placeholder="Rechercher un nom ou une heure"></div>
      <p id="agendaStatus" role="status" aria-live="polite"></p>
      <ol id="agendaList" aria-label="Rendez-vous de la journée"></ol>
      <small id="agendaSync" hidden></small>
      <a id="agendaReconnect" class="btn secondary" href="{{ url_for('login', next='/secretariat') }}" hidden>Se reconnecter</a>
    </div>
    {% else %}
    <div class="agenda-body agenda-access"><p>Connectez-vous pour vérifier l’heure d’un rendez-vous, le nom de l’appelant et le résultat de l’appel.</p><a class="btn secondary" href="{{ url_for('login', next='/secretariat') }}">Se connecter</a></div>
    {% endif %}
  </details>
</aside>
