<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Demandes de devis — Intégrale Academy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f5f6f8;
}
.container{
    max-width:1200px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
}
h1{
    margin-top:0;
}

/* Outils */
.tools{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}
.tools button{
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    background:#e9ecef;
    font-size:13px;
}
.tools button.active{
    background:#0d6efd;
    color:white;
}
#search{
    flex:1;
    padding:8px 14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

/* Tableau */
table{
    width:100%;
    border-collapse:collapse;
}
thead{
    background:#f0f2f5;
}
th, td{
    padding:10px 8px;
    font-size:14px;
    border-bottom:1px solid #eee;
}

/* Alternance */
tbody tr:nth-child(odd){
    background:#ffffff;
}
tbody tr:nth-child(even){
    background:#f7f7f7;
}

/* Badges */
.badge{
    padding:4px 10px;
    border-radius:14px;
    font-size:11px;
    font-weight:600;
}
.badge-red{
    background:#fdecea;
    color:#c0392b;
}
.badge-green{
    background:#eafaf1;
    color:#1e8449;
}

/* Actions compactes */
.action-mini{
    padding:5px 9px;
    margin-right:4px;
    border-radius:6px;
    border:none;
    font-size:11px;
    cursor:pointer;
    color:white;
}
.btn-plan{ background:#6f42c1; }
.btn-voir{ background:#343a40; }
.btn-send{ background:#198754; }
.btn-send.disabled{
    background:#adb5bd;
    cursor:not-allowed;
}
.btn-change{ background:#0d6efd; }
.btn-delete{ background:#dc3545; }

</style>
</head>

<body>
<div class="container">

<h1>📄 Demandes de devis</h1>

<!-- 🔹 Barre outils -->
<div class="tools">
    <button id="filtre-tous" class="active">Tous</button>
    <button id="filtre-envoyer">À envoyer</button>
    <button id="filtre-envoyes">Envoyés</button>
    <input type="text" id="search" placeholder="🔍 Rechercher un nom, prénom, formation…">
</div>

<table>
<thead>
<tr>
    <th>Date</th>
    <th>Nom</th>
    <th>Prénom</th>
    <th>Formation</th>
    <th>Statut</th>
    <th>Action</th>
</tr>
</thead>

<tbody id="table-body">
{% for d in devis %}
<tr class="row"
    data-statut="{{ d.statut_devis }}"
    data-search="{{ (d.nom ~ ' ' ~ d.prenom ~ ' ' ~ d.infos.formation)|lower }}">
    
    <td>{{ d.date }}</td>

    <td>
        {{ d.nom }}
        {% if d.notation_interne == "CHAUD" %}
            <span style="font-size:16px;margin-left:5px;">🔥</span>
        {% endif %}
    </td>

    <td>{{ d.prenom }}</td>
    <td>{{ d.infos.formation }}</td>

    <td>
        {% if d.statut_devis == "Envoyé" %}
            <span class="badge badge-green">Envoyé</span>
        {% else %}
            <span class="badge badge-red">À envoyer</span>
        {% endif %}
    </td>

    <td>

        <a href="{{ url_for('plan_financement_devis', devis_id=d.id) }}"
           target="_blank"
           class="action-mini btn-plan">📄</a>

        <a href="{{ url_for('voir_dossier_devis', devis_id=d.id) }}"
           target="_blank"
           class="action-mini btn-voir">👁️</a>

        <form method="POST"
              action="{{ url_for('envoyer_plan_financement', devis_id=d.id) }}"
              style="display:inline;">
            <button type="submit"
                class="action-mini btn-send {% if d.statut_devis == 'Envoyé' %}disabled{% endif %}">
                📧
            </button>
        </form>

        <form method="POST"
              action="{{ url_for('toggle_devis', devis_id=d.id) }}"
              style="display:inline;">
            <button class="action-mini btn-change">🔄</button>
        </form>

        <form method="POST"
              action="{{ url_for('delete_devis', devis_id=d.id) }}"
              style="display:inline;"
              onsubmit="return confirm('Supprimer définitivement ?');">
            <button class="action-mini btn-delete">🗑️</button>
        </form>

    </td>

</tr>
{% endfor %}
</tbody>
</table>
</div>

<script>
// --- Recherche instantanée
const search = document.getElementById("search");
const rows = document.querySelectorAll(".row");

search.addEventListener("input", () => {
    const q = search.value.toLowerCase();
    rows.forEach(r => {
        r.style.display = r.dataset.search.includes(q) ? "" : "none";
    });
    applyFilter(currentFilter);
});

let currentFilter = "tous";

function applyFilter(f){
    currentFilter = f;
    rows.forEach(r => {
        if(r.style.display === "none"){ return; }
        const s = r.dataset.statut;
        if(f==="tous"){ r.style.display=""; }
        else if(f==="envoyer"){ r.style.display = (s === "A envoyer") ? "" : "none"; }
        else if(f==="envoyes"){ r.style.display = (s === "Envoyé") ? "" : "none"; }
    });
}

function setActive(btn){
    document.querySelectorAll(".tools button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
}

document.getElementById("filtre-tous").onclick = e => { setActive(e.target); applyFilter("tous"); };
document.getElementById("filtre-envoyer").onclick = e => { setActive(e.target); applyFilter("envoyer"); };
document.getElementById("filtre-envoyes").onclick = e => { setActive(e.target); applyFilter("envoyes"); };

</script>

</body>
</html>
