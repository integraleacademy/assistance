<form id="directBooking" class="direct-booking" hidden>
  <h3>Choisir un créneau Calendly</h3>
  <div class="field" id="deskAgendaChoice" hidden><label for="deskBookingAgenda">Agenda de rendez-vous</label><select id="deskBookingAgenda"></select></div>
  <div class="booking-week">
    <button type="button" class="btn secondary" id="previousBookingWeek" aria-label="Semaine précédente">‹</button>
    <strong id="bookingWeekLabel"></strong>
    <button type="button" class="btn secondary" id="nextBookingWeek" aria-label="Semaine suivante">›</button>
  </div>
  <div class="field"><label for="deskSlot">Créneau téléphonique · heure de Paris</label><select id="deskSlot" required></select></div>
  <div id="deskEventQuestions"></div>
  <div class="field"><label for="deskSmsNumber">Envoyer un SMS à</label>
    <input id="deskSmsNumber" type="tel" autocomplete="off">
    <label class="sms-consent"><input type="checkbox" id="deskSmsConsent"> L’appelant souhaite recevoir le rappel par SMS à ce numéro.</label>
  </div>
  <button type="submit" id="bookDeskSlot" class="btn primary" disabled>Confirmer le rendez-vous</button>
</form>
<button type="button" class="btn secondary" id="hostedBooking" hidden>Revenir au calendrier Calendly</button>
