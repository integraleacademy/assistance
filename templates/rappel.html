<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demande de rappel - Intégrale Academy</title>
  <style>
    html, body {
      background-color: #fdfaf5;
      font-family: "Inter", Arial, sans-serif;
      margin: 0;
      padding: 0;
      overscroll-behavior: contain;
    }

    .container {
      max-width: 600px;
      margin: 10px auto;
      background: #fff;
      padding: 20px 16px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    img.logo {
      max-width: 120px;
      display: block;
      margin: 0 auto 18px;
    }

    h2 {
      color: #0d6efd;
      text-align: center;
      font-size: 22px;
      margin: 0 0 10px;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .section-title {
      font-weight: bold;
      color: #333;
      font-size: 15px;
      margin-top: 25px;
      margin-bottom: 10px;
    }

    /* === BOUTONS DOMAINES === */
    .formations-group {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
    }

    .formations-group button {
      flex: 1 1 30%;
      background-color: #f4c45a;
      color: #000;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.25s ease;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.12);
    }

    .formations-group button.active {
      background: linear-gradient(90deg, #0d6efd, #2563eb);
      color: white;
      box-shadow: 0 5px 12px rgba(13, 110, 253, 0.4);
    }

    /* === CASES À COCHER STYLÉES === */
    .checkbox-list {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
      margin-bottom: 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .checkbox-list.active {
      display: flex;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-5px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .checkbox-list label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      color: #222;
      background: #fafafa;
      border-radius: 10px;
      padding: 10px 12px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .checkbox-list label:hover {
      background: #f1f5ff;
    }

    .checkbox-list input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #0d6efd;
      cursor: pointer;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
      box-sizing: border-box;
      background: #fafafa;
      transition: border 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #0d6efd;
      outline: none;
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button.submit {
      width: 100%;
      background-color: #0d6efd;
      color: white;
      font-weight: bold;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    button.submit:hover {
      background-color: #084fc6;
    }

    @media (max-width: 600px) {
      .formations-group {
        flex-direction: column;
        gap: 10px;
      }

      .formations-group button {
        width: 100%;
      }

      .checkbox-list label {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/static/logo.png" class="logo" alt="Logo Intégrale Academy">
    <h2>📞 Demande de rappel téléphonique</h2>
    <p class="subtitle">Merci de compléter le formulaire ci-dessous. Un conseiller vous contactera rapidement.</p>

    <form id="rappelForm" method="POST">
      <div class="section-title">Je souhaite être rappelé concernant :</div>

      <div class="formations-group">
        <button type="button" class="category-btn active" data-cat="securite">Métiers de la Sécurité Privée</button>
        <button type="button" class="category-btn" data-cat="bts">BTS en Alternance</button>
        <button type="button" class="category-btn" data-cat="vtc">Chauffeur VTC</button>
      </div>

      <div id="formationsContainer"></div>

      <div class="section-title">Vos informations :</div>
      <input type="text" name="nom" placeholder="Nom" required>
      <input type="text" name="prenom" placeholder="Prénom" required>
      <input type="tel" name="telephone" placeholder="Numéro de téléphone" required>
      <input type="email" name="mail" placeholder="Adresse e-mail" required>

      <div class="section-title">Votre commentaire (facultatif) :</div>
      <textarea name="commentaire" rows="3" placeholder="Exemple : merci de me rappeler au plus vite, je souhaite des infos sur le financement..."></textarea>

      <div class="section-title">Mes préférences de rappel :</div>
      <select name="plage" required>
        <option value="N'importe quand">N'importe quand</option>
        <option value="10h00 - 12h00">10h00 - 12h00</option>
        <option value="12h00 - 14h00">12h00 - 14h00</option>
        <option value="14h00 - 16h00">14h00 - 16h00</option>
        <option value="16h00 - 18h00">16h00 - 18h00</option>
      </select>

      <button type="submit" class="submit">📞 Envoyer ma demande</button>
    </form>
  </div>

  <script>
    const catButtons = document.querySelectorAll('.category-btn');
    const formationsContainer = document.getElementById('formationsContainer');
    const form = document.getElementById('rappelForm');

    const options = {
      securite: [
        "Agent de prévention et de sécurité (APS)",
        "Agent de protection physique des personnes (A3P)",
        "Dirigeant d'entreprise de sécurité privée (DESP)",
        "Agent de sécurité incendie (SSIAP)"
      ],
      bts: [
        "BTS Management Opérationnel de la Sécurité (MOS)",
        "BTS Management Commercial Opérationnel (MCO)",
        "BTS Commerce International (CI)",
        "BTS Négociation et Digitalisation de la Relation Client (NDRC)",
        "BTS Professions Immobilières (PI)",
        "BTS Comptabilité Gestion (CG)"
      ],
      vtc: [
        "Chauffeur VTC"
      ]
    };

    function renderCheckboxList(cat) {
      formationsContainer.innerHTML = "";
      const list = document.createElement('div');
      list.classList.add('checkbox-list', 'active');
      options[cat].forEach(f => {
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.name = 'formations[]';
        checkbox.value = f;
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(f));
        list.appendChild(label);
      });
      formationsContainer.appendChild(list);
    }

    renderCheckboxList('securite');

    catButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        catButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderCheckboxList(btn.dataset.cat);
      });
    });

    // 🔒 Validation + redirection conditionnelle
    form.addEventListener('submit', (e) => {
      const checkboxes = document.querySelectorAll('input[name="formations[]"]');
      const isChecked = Array.from(checkboxes).some(cb => cb.checked);
      if (!isChecked) {
        e.preventDefault();
        alert("Veuillez sélectionner au moins une formation avant d'envoyer votre demande.");
        return;
      }

      // ✅ Vérifie les redirections spécifiques
      const checkedValues = Array.from(checkboxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);

      if (checkedValues.includes("Chauffeur VTC")) {
        e.preventDefault();
        window.location.href = "https://www.integraleacademy.com/rdvvtc";
      } 
      else if (checkedValues.includes("Dirigeant d'entreprise de sécurité privée (DESP)")) {
        e.preventDefault();
        window.location.href = "https://www.integraleacademy.com/rdvconfirmedirigeant";
      }
    });

    // 📱 Corrige le blocage du scroll sur mobile (clavier)
    document.querySelectorAll('input, textarea, select').forEach(el => {
      el.addEventListener('focus', () => {
        setTimeout(() => {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 300);
      });
    });
  </script>
</body>
</html>
