<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmation - Intégrale Academy</title>
  <style>
    body {
      background-color: #f5f7fa;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 95%;
      max-width: 480px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    img.logo {
      max-width: 100px;
      margin-bottom: 15px;
    }
    h2 {
      color: #198754;
      margin-bottom: 10px;
      font-size: 22px;
    }
    p {
      font-size: 15px;
      color: #333;
      margin-bottom: 15px;
    }
    .success {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 8px;
      margin: 15px 0;
      font-weight: bold;
    }
    .back-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #0d6efd;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
    }
    .back-btn:hover {
      background: #0b5ed7;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/static/logo.png" alt="Logo Intégrale Academy" class="logo">
    <h2>✅ Demande envoyée</h2>
    <p>Merci <strong>{{ request.form.get('prenom') }}</strong>, votre demande a bien été transmise.</p>
    <div class="success">
      📩 Vous recevrez bientôt un mail de confirmation.
    </div>
    <a href="/" class="back-btn">⬅️ Retour à l’accueil</a>
  </div>
</body>
</html>
